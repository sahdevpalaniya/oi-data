services:
  - type: web
    name: weekly-fno-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    disk:
      name: weekly-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      # Must match what the code reads (src/signal/oiSnapshotWriter.js,
      # src/paper/*.js). This previously said DATA_DIR, which nothing reads —
      # so every snapshot and paper-trade journal was written to the ephemeral
      # container filesystem and lost on each deploy/restart.
      - key: FNO_DATA_ROOT
        value: /data/fno
